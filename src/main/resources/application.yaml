spring:
  application:
    name: saas.tenant.platform

  datasource:
    url: jdbc:postgresql://localhost:5432/appdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true