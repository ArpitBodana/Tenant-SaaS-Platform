spring:
  application:
    name: saas.tenant.platform

  datasource:
    url: jdbc:postgresql://localhost:5432/appdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-must-be-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}